stages:
  - build
  - test

cache:
  key: maven-cache
  paths:
    - .m2/repository

before_script:
  - chmod +x mvnw
  - ./mvnw install:install-file -Dfile=libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  - ./mvnw install:install-file -Dfile=libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  - ./mvnw install:install-file -Dfile=libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository


build-job:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  script:
    - ./mvnw compile -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository


unit-test-job:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - ./mvnw test -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository